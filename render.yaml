databases:
  - name: intranet-db
    databaseName: intranet
    plan: free
    region: oregon

services:
  # ── NestJS API ──────────────────────────────────────────────────────────────
  - type: web
    name: intranet-api
    runtime: node
    plan: free
    region: oregon
    rootDir: packages/api
    # NODE_ENV=development during install so devDeps (prisma CLI, ts-node) are included
    # preDeployCommand is NOT supported on free plan — migrations run in startCommand instead
    buildCommand: NODE_ENV=development npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && ./node_modules/.bin/ts-node prisma/seed.ts && node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: intranet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INTERNAL_TOKEN
        generateValue: true
      # Netlify frontend URLs (CORS allowlist)
      - key: APP_URL
        value: https://intranet-web-618.netlify.app
      - key: ADMIN_URL
        value: https://intranet-admin.netlify.app
      # AI engine URL — auto-filled from the intranet-ai service
      - key: AI_ENGINE_URL
        fromService:
          name: intranet-ai
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Allow gmail + company domains for registration
      - key: ALLOWED_EMAIL_DOMAINS
        value: gmail.com,company.com
      - key: OTP_EXPIRY_SECONDS
        value: "300"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      # ── Email (SMTP) — fill in Render dashboard after deploy ──────────────
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # ── Object storage (Cloudflare R2 / MinIO) — fill in after deploy ─────
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_PORT
        value: "443"
      - key: MINIO_USE_SSL
        value: "true"
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        value: intranet-docs

  # ── Python FastAPI AI Engine ─────────────────────────────────────────────────
  - type: web
    name: intranet-ai
    runtime: python
    plan: free
    region: oregon
    rootDir: packages/ai-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # API callback URL — auto-filled from the intranet-api service
      - key: API_URL
        fromService:
          name: intranet-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Shared secret for internal API calls
      - key: INTERNAL_TOKEN
        fromService:
          name: intranet-api
          type: web
          envVarKey: INTERNAL_TOKEN
      # ── OpenAI — fill in Render dashboard after deploy ────────────────────
      - key: OPENAI_API_KEY
        sync: false
      # ── Qdrant Cloud — fill in Render dashboard after deploy ──────────────
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_COLLECTION
        value: intranet_docs
      # Model settings
      - key: AI_MODEL
        value: gpt-4o
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSION
        value: "1536"
      - key: RAG_TOP_K
        value: "10"
      - key: RAG_RERANK_TOP_N
        value: "5"
      - key: RAG_CHUNK_SIZE
        value: "512"
      - key: RAG_CHUNK_OVERLAP
        value: "64"
      - key: AI_MAX_TOKENS
        value: "2048"
